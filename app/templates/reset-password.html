{% extends "_account_base.html" %}
{% block title %}Neues Passwort setzen{% endblock %}
{% block heading %}Neues Passwort setzen{% endblock %}

{% block content %}
<form action="/reset-password/{{ token }}" method="post">
    {{ csrf_field }}
    <label for="password">Neues Passwort</label>
    <input type="password" id="password" name="password" required minlength="10" autofocus>

    <label for="password_repeat">Passwort wiederholen</label>
    <input type="password" id="password_repeat" name="password_repeat" required minlength="10">

    <button type="submit">Passwort setzen</button>
</form>
<div class="links"><a href="/login">Zurück zur Anmeldung</a></div>
{% endblock %}
