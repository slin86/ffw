apiVersion: v1
kind: ConfigMap
metadata:
  name: ff-trainingskarte-config
  namespace: feuerwehr
data:
  APP_PROFILE: "prod"
  SERVER_PORT: "8080"
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  SESSION_TTL_SECONDS: "28800"
  # feuerwehr.slin.io terminates TLS at Traefik, so the session cookie is
  # Secure. Keep this false only for plain-HTTP access on home.lan.
  SESSION_COOKIE_SECURE: "true"
  # Identifies the app to Nominatim; their usage policy expects a real contact.
  NOMINATIM_USER_AGENT: "ffw-trainingskarte/1.0 (privates Hobby-Projekt)"
