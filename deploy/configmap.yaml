apiVersion: v1
kind: ConfigMap
metadata:
  name: ffw-funk-config
  namespace: ffw-funk
data:
  APP_PROFILE: "prod"
  SERVER_PORT: "8080"

  # Redis lives in its own namespace and is shared with the Java app. Index 1
  # keeps the two session stores apart - the key prefixes already differ
  # ("SESSION:" here, "spring:session:" there), but a FLUSHDB would not care.
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "1"

  SESSION_TTL_SECONDS: "28800"
  # Traefik terminates TLS for ffw-funk.slin.io, so the session cookie is Secure.
  SESSION_COOKIE_SECURE: "true"

  # Mail goes through the central Postfix relay, which is the only component
  # that knows about SES. No credentials: it is reachable from inside the
  # cluster only.
  MAIL_ENABLED: "true"
  SMTP_HOST: "mail-relay.mail.svc.cluster.local"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@slin.io"

  # Absolute base for the links in verification and reset mails. Must be the
  # public host: a link to ffw-funk.home.lan is useless on a phone.
  PUBLIC_BASE_URL: "https://ffw-funk.slin.io"

  # Nominatim's usage policy expects an identifiable client.
  NOMINATIM_USER_AGENT: "ffw-funk/1.0 (privates Hobby-Projekt; https://ffw-funk.slin.io)"
