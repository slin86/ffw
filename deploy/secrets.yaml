# Template only - do NOT commit real values. In the cluster these come from
# Infisical; create an InfisicalSecret that produces a Secret named
# "ffw-funk-secrets" in the ffw-funk namespace with exactly these keys.
#
# DB_URL accepts the jdbc:postgresql:// form as well and translates it
# (see app/config.py), so you can copy the value from the Java app unchanged.
#
# Own database (matches the init container in deployment.yaml):
#   DB_URL=postgresql+asyncpg://<host>:5432/ffw_funk
# Shared with the Java app (then remove the init container):
#   DB_URL=postgresql+asyncpg://<host>:5432/ff_trainingskarte
apiVersion: v1
kind: Secret
metadata:
  name: ffw-funk-secrets
  namespace: ffw-funk
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-ei-fj
        secretsPath: /ffw-funk
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  managedKubeSecretReferences:
    - secretName: ffw-funk-secrets
      secretNamespace: ffw-funk
      secretType: Opaque
  resyncInterval: 60

