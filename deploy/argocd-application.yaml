# Apply this once into the argocd namespace (or add it to your app-of-apps).
# It is NOT part of kustomization.yaml - ArgoCD should not manage its own
# Application object through the same sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ffw-funk
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ADJUST if the Python port lives in a different repository than the Java app.
    repoURL: https://github.com/slin86/ffw-trainingsmap.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ffw-funk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is in the manifests, but this covers a first sync where
      # ArgoCD needs it before anything else applies.
      - CreateNamespace=true
