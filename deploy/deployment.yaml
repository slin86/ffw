apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffw-funk
  namespace: ffw-funk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffw-funk
  template:
    metadata:
      labels:
        app: ffw-funk
    spec:
      # Alembic runs before the app starts, where Flyway used to sit inside the
      # Spring boot sequence.
      #
      # This assumes ffw-funk has its OWN database (see secrets.yaml).
      # If you point it at the database the Java app already uses, DELETE this
      # init container and run `alembic stamp 0001_initial` once by hand -
      # otherwise it issues CREATE TABLE against tables Flyway already created.
      initContainers:
        - name: migrate
          image: ghcr.io/slin86/ffw-funk:0.6.4
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ffw-funk-config
            - secretRef:
                name: ffw-funk-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: app
          image: ghcr.io/slin86/ffw-funk:0.6.4
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          envFrom:
            - configMapRef:
                name: ffw-funk-config
            - secretRef:
                name: ffw-funk-secrets
          readinessProbe:
            httpGet:
              # Public by design - the map header reads it before anything else
              # loads. Replaces the actuator health endpoint.
              path: /api/version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            # Measured: 72 MB after startup, ~110 MB under load. 128Mi request
            # with a 256Mi limit leaves room without over-reserving.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
